<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linked-Store</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fontsource-inter@5.0.0/index.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f8f9fc;
            min-height: 100vh;
            color: #1a1a2e;
        }

        /* Header */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 40px;
            background: #ffffff;
            border-bottom: 1px solid #e8eaf0;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
            background: rgba(255,255,255,0.95);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 20px;
            font-weight: 700;
            color: #1a1a2e;
            text-decoration: none;
        }

        .logo-dot {
            width: 12px;
            height: 12px;
            background: #4f6ef7;
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.15); }
        }

        nav {
            display: flex;
            align-items: center;
            gap: 32px;
        }

        nav a {
            text-decoration: none;
            color: #6b7280;
            font-size: 15px;
            font-weight: 500;
            transition: color 0.3s;
        }

        nav a:hover {
            color: #4f6ef7;
        }

        .nav-explore {
            color: #4f6ef7;
            font-weight: 600;
        }

        /* Main Content */
        main {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 70px);
            padding: 40px 20px;
        }

        .card {
            background: #ffffff;
            border-radius: 24px;
            padding: 48px 56px;
            box-shadow: 0 4px 24px rgba(79, 110, 247, 0.08), 0 1px 4px rgba(0,0,0,0.04);
            border: 1px solid #eef0f6;
            text-align: center;
            max-width: 480px;
            width: 100%;
            animation: cardIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(30px);
        }

        @keyframes cardIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .qr-wrapper {
            background: #ffffff;
            border: 2px solid #eef0f6;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 32px;
            display: inline-block;
            position: relative;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s;
        }

        .qr-wrapper:hover {
            transform: scale(1.03);
            box-shadow: 0 8px 32px rgba(79, 110, 247, 0.15);
        }

        .qr-wrapper::before {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 20px;
            background: linear-gradient(135deg, #4f6ef7, #8b5cf6);
            z-index: -1;
            opacity: 0;
            transition: opacity 0.4s;
        }

        .qr-wrapper:hover::before {
            opacity: 1;
        }

        .qr-container {
            width: 240px;
            height: 240px;
            position: relative;
        }

        .qr-container canvas {
            width: 100%;
            height: 100%;
            border-radius: 8px;
        }

        .qr-label {
            font-size: 13px;
            color: #9ca3af;
            font-weight: 500;
            margin-bottom: 24px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .cta-button {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(135deg, #4f6ef7, #6366f1);
            color: #ffffff;
            border: none;
            padding: 18px 40px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            text-decoration: none;
            width: 100%;
            justify-content: center;
            position: relative;
            overflow: hidden;
            font-family: inherit;
        }

        .cta-button::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .cta-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(79, 110, 247, 0.35);
        }

        .cta-button:hover::before {
            opacity: 1;
        }

        .cta-button span {
            position: relative;
            z-index: 1;
        }

        .cta-button:active {
            transform: translateY(0);
        }

        .scan-icon {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
        }

        /* Decorative elements */
        .bg-decoration {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: -1;
        }

        .bg-circle {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
        }

        .bg-circle-1 {
            width: 400px;
            height: 400px;
            background: #4f6ef7;
            top: -100px;
            right: -100px;
            opacity: 0.08;
        }

        .bg-circle-2 {
            width: 300px;
            height: 300px;
            background: #8b5cf6;
            bottom: -50px;
            left: -50px;
            opacity: 0.06;
        }

        .bg-circle-3 {
            width: 200px;
            height: 200px;
            background: #4f6ef7;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0.04;
        }

        /* Footer hint */
        .footer-hint {
            text-align: center;
            margin-top: 24px;
            font-size: 13px;
            color: #9ca3af;
            animation: fadeIn 1s ease 0.5s both;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Responsive */
        @media (max-width: 600px) {
            header {
                padding: 16px 20px;
            }

            .logo {
                font-size: 17px;
            }

            .card {
                padding: 32px 24px;
                border-radius: 20px;
            }

            .qr-container {
                width: 200px;
                height: 200px;
            }

            .cta-button {
                padding: 16px 28px;
                font-size: 15px;
            }

            nav {
                gap: 20px;
            }
        }

        /* Ripple effect */
        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255,255,255,0.4);
            transform: scale(0);
            animation: rippleAnim 0.6s linear;
            pointer-events: none;
        }

        @keyframes rippleAnim {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        /* Scan line animation */
        .scan-line {
            position: absolute;
            left: 10%;
            right: 10%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #4f6ef7, transparent);
            animation: scanMove 2.5s ease-in-out infinite;
            opacity: 0.6;
            border-radius: 2px;
        }

        @keyframes scanMove {
            0%, 100% { top: 15%; }
            50% { top: 85%; }
        }
    </style>
</head>
<body>
    <div class="bg-decoration">
        <div class="bg-circle bg-circle-1"></div>
        <div class="bg-circle bg-circle-2"></div>
        <div class="bg-circle bg-circle-3"></div>
    </div>

    <header>
        <a href="#" class="logo">
            <div class="logo-dot"></div>
            Linked-Store
        </a>
        <nav>
            <a href="#">Products</a>
            <a href="#">About</a>
            <a href="#" class="nav-explore">Explore</a>
        </nav>
    </header>

    <main>
        <div class="card">
            <div class="qr-wrapper">
                <div class="qr-container">
                    <canvas id="qrCanvas" width="240" height="240"></canvas>
                    <div class="scan-line"></div>
                </div>
            </div>
            <div class="qr-label">Scan QR Code</div>
            <button class="cta-button" id="ctaBtn">
                <span class="scan-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 7V5a2 2 0 0 1 2-2h2"/>
                        <path d="M17 3h2a2 2 0 0 1 2 2v2"/>
                        <path d="M21 17v2a2 2 0 0 1-2 2h-2"/>
                        <path d="M7 21H5a2 2 0 0 1-2-2v-2"/>
                        <line x1="7" y1="12" x2="17" y2="12"/>
                    </svg>
                </span>
                <span>Scan to find out more or Click here</span>
            </button>
            <div class="footer-hint">
                Point your camera at the QR code to get started
            </div>
        </div>
    </main>

    <script>
        // Generate a realistic-looking QR code pattern on canvas
        function drawQRCode() {
            const canvas = document.getElementById('qrCanvas');
            const ctx = canvas.getContext('2d');
            const size = 240;
            const modules = 25;
            const cellSize = size / modules;

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, size, size);

            // Generate pseudo-random pattern
            const seed = 42;
            function pseudoRandom(x, y) {
                const n = Math.sin(x * 127.1 + y * 311.7 + seed) * 43758.5453;
                return n - Math.floor(n);
            }

            // Draw data modules
            ctx.fillStyle = '#1a1a2e';
            for (let row = 0; row < modules; row++) {
                for (let col = 0; col < modules; col++) {
                    // Skip finder pattern areas
                    if (row < 7 && col < 7) continue;
                    if (row < 7 && col >= modules - 7) continue;
                    if (row >= modules - 7 && col < 7) continue;

                    if (pseudoRandom(row, col) > 0.5) {
                        ctx.fillRect(
                            col * cellSize,
                            row * cellSize,
                            cellSize,
                            cellSize
                        );
                    }
                }
            }

            // Draw finder patterns
            function drawFinder(x, y) {
                const s = cellSize;
                // Outer
                ctx.fillStyle = '#1a1a2e';
                ctx.fillRect(x * s, y * s, 7 * s, 7 * s);
                // White ring
                ctx.fillStyle = '#ffffff';
                ctx.fillRect((x + 1) * s, (y + 1) * s, 5 * s, 5 * s);
                // Inner
                ctx.fillStyle = '#1a1a2e';
                ctx.fillRect((x + 2) * s, (y + 2) * s, 3 * s, 3 * s);
            }

            drawFinder(0, 0);
            drawFinder(modules - 7, 0);
            drawFinder(0, modules - 7);

            // Draw timing patterns
            ctx.fillStyle = '#1a1a2e';
            for (let i = 8; i < modules - 8; i++) {
                if (i % 2 === 0) {
                    ctx.fillRect(i * cellSize, 6 * cellSize, cellSize, cellSize);
                    ctx.fillRect(6 * cellSize, i * cellSize, cellSize, cellSize);
                }
            }

            // Alignment pattern
            const ax = modules - 9;
            const ay = modules - 9;
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(ax * cellSize, ay * cellSize, 5 * cellSize, 5 * cellSize);
            ctx.fillStyle = '#ffffff';
            ctx.fillRect((ax + 1) * cellSize, (ay + 1) * cellSize, 3 * cellSize, 3 * cellSize);
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect((ax + 2) * cellSize, (ay + 2) * cellSize, cellSize, cellSize);
        }

        drawQRCode();

        // Ripple effect on button click
        const btn = document.getElementById('ctaBtn');
        btn.addEventListener('click', function(e) {
            const rect = btn.getBoundingClientRect();
            const ripple = document.createElement('span');
            ripple.className = 'ripple';
            const size = Math.max(rect.width, rect.height);
            ripple.style.width = ripple.style.height = size + 'px';
            ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
            ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
            btn.appendChild(ripple);
            setTimeout(() => ripple.remove(), 600);
        });

        // Intersection observer for card animation
        const card = document.querySelector('.card');
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.style.animationPlayState = 'running';
                }
            });
        });
        observer.observe(card);
    </script>
</body>
</html>
