# ==================================================================
#  nginx default server for Linked-Store Angular frontend
#  - Serves the compiled SPA at /usr/share/nginx/html
#  - Reverse proxies /api, /products, /stream, /stripe to backend
#  - SPA fallback: unknown URIs go to /index.html (hashless routing)
#
#  DEPLOY VIA STANDARD NGINX DOCKER IMAGE (ZERO custom shell scripts):
#
#  This file lives in the image at:
#       /etc/nginx/templates/default.conf.template
#
#  The OFFICIAL nginx docker image (nginx:1.27-alpine) ships with
#  /docker-entrypoint.d/20-envsubst-on-templates.sh which runs
#  envsubst automatically BEFORE nginx starts, for every file named
#  *.template under /etc/nginx/templates/. Output goes to
#  /etc/nginx/conf.d/<basename>.conf. That's the standard, portable
#  mechanism — no custom entrypoint.sh required.
#
#  HOW env var replacement works here:
#
#    • Container environment variables you MUST set explicitly
#      in your orchestrator / host / Render UI Env:
#
#        1. ${API_PROXY_URL}   → Backend REST origin (scheme + host).
#                                Example: https://vicinity24api.com
#                                No trailing slash.
#
#        2. ${NGINX_RESOLVER}  → DNS resolver. On Docker / Kubernetes
#                                / Render always equals 127.0.0.11
#                                (Docker embedded DNS). Because this
#                                is a container-infrastructure detail
#                                that never changes on Docker platforms,
#                                the Dockerfile sets a safe default
#                                ENV NGINX_RESOLVER=127.0.0.11 so the
#                                user only needs to override it if
#                                deploying outside Docker.
#
#    • All nginx-native variables (those prefixed with a single $
#      that live inside the nginx runtime — e.g. $$http_host,
#      $$remote_addr, $$scheme, $$uri) are written with TWO dollar
#      signs in this template so that envsubst reduces them to a
#      single $ and leaves them for nginx to resolve at request time.
#
#    • ONLY the two container env vars above use SINGLE $ with curly
#      braces. Everything else is $$ — NO EXCEPTIONS.
#
#  THERE ARE NO MAGIC FALLBACK VALUES HARDCODED HERE. The operator is
#  in full control via container env; envsubst substitutes exactly
#  what is pasted into the environment. If API_PROXY_URL is unset the
#  proxy_pass target becomes empty → nginx returns 502 / fails config
#  check. That is intentional ("no magic" = fail fast on misconfig).
# ==================================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Cache static assets aggressively (Angular bundles are content-hashed)
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        image/x-icon
        font/woff
        font/woff2
        application/font-woff2;

    root /usr/share/nginx/html;
    index index.html;

    # Docker embedded DNS. Injected via container env NGINX_RESOLVER
    # (always 127.0.0.11 on Docker/Render/K8s — defaulted in Dockerfile
    # and overridable via Render UI if running on bare metal nginx.)
    resolver ${NGINX_RESOLVER} ipv6=off valid=30s;

    # --- Backend API reverse proxy (matches proxy.conf.json paths) ---
    #
    # $$api_proxy is a per-request nginx variable that holds the value
    # from the container env ${API_PROXY_URL} (Render UI env var pasted
    # by operator). No fallback, no hardcoded vicinity24api.com guess,
    # no *.onrender.com wildcard.
    #
    set $$api_proxy "${API_PROXY_URL}";

    location /api/ {
        proxy_set_header Host              $$http_host;
        proxy_set_header X-Real-IP         $$remote_addr;
        proxy_set_header X-Forwarded-For   $$proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $$scheme;
        proxy_http_version 1.1;
        proxy_pass $$api_proxy;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 30s;
    }

    location /products/ {
        proxy_set_header Host              $$http_host;
        proxy_set_header X-Real-IP         $$remote_addr;
        proxy_set_header X-Forwarded-For   $$proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $$scheme;
        proxy_http_version 1.1;
        proxy_pass $$api_proxy;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 30s;
    }

    # --- Long-lived Server-Sent Events streaming support ---
    location /stream/ {
        proxy_set_header Host              $$http_host;
        proxy_set_header X-Real-IP         $$remote_addr;
        proxy_set_header X-Forwarded-For   $$proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $$scheme;
        proxy_set_header Connection        '';
        proxy_http_version 1.1;
        proxy_pass $$api_proxy;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
    }

    # --- Stripe webhook endpoints (also forwarded) ---
    location /stripe/ {
        proxy_set_header Host              $$http_host;
        proxy_set_header X-Real-IP         $$remote_addr;
        proxy_set_header X-Forwarded-For   $$proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $$scheme;
        proxy_http_version 1.1;
        proxy_pass $$api_proxy;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_connect_timeout 15s;
    }

    # --- SPA fallback: send unknown paths to the Angular entry point ---
    # IMPORTANT: Keep this last, after the proxy locations above.
    location / {
        try_files $$uri $$uri/ /index.html;

        # Long cache for hashed .js/.css bundles built by Angular
        location ~* \.(?:js|css|woff2?|ttf|eot|otf|svg|ico|png|jpg|jpeg|gif|webp|avif)$$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $$uri =404;
        }

        # No-cache for the entry-point HTML itself so new deploys show up
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
            try_files /index.html =500;
        }
    }
}
