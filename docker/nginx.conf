# ==================================================================
#  nginx default server for Linked-Store Angular frontend on Render
#  - Serves the compiled SPA at /usr/share/nginx/html
#  - Reverse proxies /api, /products, /stream, /stripe to backend
#  - SPA fallback: unknown URIs go to /index.html (hashless routing)
#
#  EXPLICIT MODE / NO MAGIC:
#
#  Every runtime value that differs between deploys MUST be passed
#  from the Render Dashboard → Environment. There are no hardcoded
#  production fallbacks here, and there are no onrender.com wildcards:
#
#    1. ${API_PROXY_URL}   — backend public origin
#                            (e.g. https://vicinity24api.com)
#    2. ${NGINX_RESOLVER}  — DNS resolver used for variable proxy_pass
#                            (Docker embedded DNS = 127.0.0.11 by default
#                            and provided by docker/entrypoint.sh if the
#                            user does not override it manually.)
# ==================================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Cache static assets aggressively (Angular bundles are content-hashed)
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        image/x-icon
        font/woff
        font/woff2
        application/font-woff2;

    root /usr/share/nginx/html;
    index index.html;

    # Docker embedded DNS. Value injected via envsubst from the
    # NGINX_RESOLVER env var (default 127.0.0.11 provided by entrypoint
    # unless the user overrides it manually in Render Environment).
    resolver ${NGINX_RESOLVER} ipv6=off valid=30s;

    # --- Backend API reverse proxy (matches proxy.conf.json paths) ---
    #
    # Value of $api_proxy comes exclusively from ${API_PROXY_URL} as set
    # by the operator in Render UI. There is NO fallback to localhost,
    # vicinity24api.com, or any *.onrender.com wildcard in this file.
    #
    set $api_proxy "${API_PROXY_URL}";

    location /api/ {
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_pass $api_proxy;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 30s;
    }

    location /products/ {
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_pass $api_proxy;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 30s;
    }

    # --- Long-lived Server-Sent Events streaming support ---
    location /stream/ {
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        '';
        proxy_http_version 1.1;
        proxy_pass $api_proxy;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
    }

    # --- Stripe webhook endpoints (also forwarded) ---
    location /stripe/ {
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_pass $api_proxy;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_connect_timeout 15s;
    }

    # --- SPA fallback: send unknown paths to the Angular entry point ---
    # IMPORTANT: Keep this last, after the proxy locations above.
    location / {
        try_files $uri $uri/ /index.html;

        # Long cache for hashed .js/.css bundles built by Angular
        location ~* \.(?:js|css|woff2?|ttf|eot|otf|svg|ico|png|jpg|jpeg|gif|webp|avif)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # No-cache for the entry-point HTML itself so new deploys show up
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
            try_files /index.html =500;
        }
    }
}
