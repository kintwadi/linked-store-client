# ==================================================================
#  nginx default server for Linked-Store Angular frontend on Render
#  - Serves the compiled SPA at /usr/share/nginx/html
#  - Reverse proxies /api and /products to the backend service
#  - SPA fallback: unknown URIs go to /index.html (hashless routing)
#
#  The upstream target can be overridden via envsubst using the env
#  variable API_PROXY_URL. On Render production with custom domains:
#     API_PROXY_URL = https://vicinity24api.com
#  (during initial deploy before custom DNS/SSL provisioning, swap to
#   the Render-generated *.onrender.com URL temporarily.)
# ==================================================================

# Use env var as a default. If not set, default points to localhost:8080
# Render deploy overrides this via Dockerfile CMD with envsubst OR we simply
# replace $API_PROXY_URL inside this file at runtime. To keep things simple
# and avoid needing a custom entrypoint, this file is run through envsubst
# in a wrapper entrypoint below — but to keep the frontend image identical
# on Render, we instead use a static placeholder convention:
#
# NOTE: To avoid requiring envsubst in the nginx image, we simply default
# the target below to the Render hostname-style variable via a set directive.
# If envsubst-style substitution is needed, add an entrypoint.sh that runs
#   envsubst '${API_PROXY_URL}' < /etc/nginx/conf.d/default.conf > /tmp/d.conf
#   then mv /tmp/d.conf to conf.d.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Cache static assets aggressively (Angular bundles are content-hashed)
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        image/x-icon
        font/woff
        font/woff2
        application/font-woff2;

    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 ipv6=off valid=30s;

    # --- Backend API reverse proxy (matches proxy.conf.json paths) ---
    # Render users with custom domains: API_PROXY_URL = https://vicinity24api.com
    # (no trailing slash). During initial DNS/SSL provisioning you can
    # temporarily use the Render-generated service URL:
    #   API_PROXY_URL = https://linked-store-api.onrender.com
    #
    # Use a variable to force runtime DNS re-resolution (Render hostnames
    # can rotate) and allow override via set (we set it via entrypoint below)
    set $api_proxy ${API_PROXY_URL};

    location /api/ {
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_pass $api_proxy;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 30s;
    }

    location /products/ {
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_pass $api_proxy;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 30s;
    }

    # --- Long-lived Server-Sent Events streaming support ---
    location /stream/ {
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        '';
        proxy_http_version 1.1;
        proxy_pass $api_proxy;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
    }

    # --- Stripe webhook endpoints (also forwarded) ---
    location /stripe/ {
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_pass $api_proxy;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_connect_timeout 15s;
    }

    # --- SPA fallback: send unknown paths to the Angular entry point ---
    # IMPORTANT: Keep this last, after the proxy locations above.
    location / {
        try_files $uri $uri/ /index.html;

        # Long cache for hashed .js/.css bundles built by Angular
        location ~* \.(?:js|css|woff2?|ttf|eot|otf|svg|ico|png|jpg|jpeg|gif|webp|avif)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # No-cache for the entry-point HTML itself so new deploys show up
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
            try_files /index.html =500;
        }
    }
}
