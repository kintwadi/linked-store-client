<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Linked-Store — Hyperlocal Retail</title>
    <base href="/">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <script>
      // ------- PRODUCTION DEFAULT -------
      // When the page is served from dinretail.com the shared origins helper
      // (shared/utils/origins.helper.ts) will automatically:
      //   • Use https://vicinity24api.com as the backend origin for ALL
      //     REST calls (/api/**, /products/**).
      //   • Use https://dinretail.com as the public origin encoded into
      //     QR codes / email links.
      // You do NOT need to set the window overrides below in production.
      //
      // ------- LOCAL / LAN / PHONE TESTING -------
      // Only uncomment / adapt these two variables when:
      //   * you are testing from a smartphone on your WiFi LAN (the phone
      //     cannot reach localhost:8080 / the Angular CLI dev proxy), or
      //   * your PC's WiFi adapter IP is NOT the default guessed below.
      //
      // 1. QR codes must point to a URL reachable by the scanner's browser
      //    (usually your PC's WiFi LAN IPv4, NOT localhost).
      // window.__FRONTEND_PUBLIC_ORIGIN__ = 'http://192.168.178.114:4200';
      //
      // 2. The Angular CLI proxy only works from localhost. Remote browsers
      //    (phone, tablet, another PC) need a direct backend URL.
      // window.__API_BASE_ORIGIN__ = 'http://192.168.178.114:8080';
    </script>
    <app-root></app-root>
  </body>
</html>
