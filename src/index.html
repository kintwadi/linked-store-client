<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Hyperlocal Marketplace</title>
    <base href="/">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <script>
      // ====================================================================
      //  PRODUCTION DEFAULT — Render with custom domains:
      //    • Frontend public URL  = https://dinretail.com  (also www.)
      //    • Backend REST API     = https://vicinity24api.com
      //
      //  The origins helper (shared/utils/origins.helper.ts) already
      //  picks these exact values whenever the page host resolves to
      //  `dinretail.com` or `www.dinretail.com`, so you don't need to
      //  uncomment anything on Render.
      //
      //  DURING DEPLOYMENT the nginx entrypoint (docker/entrypoint.sh)
      //  injects server-side variables below by substituting two
      //  placeholder tokens (__NGINX_API_BASE_ORIGIN__ and
      //  __NGINX_FRONTEND_PUBLIC_ORIGIN__) with the values it received
      //  via the runtime env vars API_PROXY_URL and FRONTEND_PUBLIC_ORIGIN.
      //  That means API_PROXY_URL becomes the single source of truth
      //  both for the nginx /api proxy target AND for Angular's
      //  resolveApiBase() — no mismatches possible.
      // ====================================================================
      (function () {
        // ---- SERVER-SIDE INJECTION (nginx) — leave in place ----
        var INJECTED_API = '__NGINX_API_BASE_ORIGIN__';
        var INJECTED_PUB = '__NGINX_FRONTEND_PUBLIC_ORIGIN__';
        var injectedApi = (INJECTED_API && INJECTED_API.indexOf('__NGINX_') !== 0) ? INJECTED_API : null;
        var injectedPub = (INJECTED_PUB && INJECTED_PUB.indexOf('__NGINX_') !== 0) ? INJECTED_PUB : null;
        if (injectedApi && typeof window.__API_BASE_ORIGIN__ === 'undefined') {
          window.__API_BASE_ORIGIN__ = injectedApi;
        }
        if (injectedPub && typeof window.__FRONTEND_PUBLIC_ORIGIN__ === 'undefined') {
          window.__FRONTEND_PUBLIC_ORIGIN__ = injectedPub;
        }
      })();

      // ====================================================================
      //  LOCAL / LAN / PHONE TESTING — only touch below this block if you
      //  are testing from a smartphone on your WiFi LAN.
      //  When uncommented these take precedence over both (a) nginx
      //  injection and (b) the hostname-based default (origins helper).
      // ====================================================================
      // window.__FRONTEND_PUBLIC_ORIGIN__ = 'http://192.168.178.114:4200';
      // window.__API_BASE_ORIGIN__       = 'http://192.168.178.114:8080';
    </script>
    <app-root></app-root>
  </body>
</html>
