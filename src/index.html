<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Linked-Store — Hyperlocal Retail</title>
    <base href="/">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <script>
      // Override the public origin that is encoded into the QR code.
      // Use the REAL WiFi / LAN adapter IP of this PC (NOT VMware/VMnet virtual adapters).
      // Your PC's current WiFi IPv4 is 192.168.178.114 on subnet 192.168.178.0/24.
      //  - 192.168.137.1 was a VMware VMnet8 host-only adapter — unreachable from phones.
      window.__FRONTEND_PUBLIC_ORIGIN__ = 'http://192.168.178.114:4200';

      // Override the REST API origin for smartphones / remote browsers.
      // The Angular dev proxy (/api → localhost:8080) only works when loading
      // the page from localhost:4200. Any other client (phone, different PC)
      // must hit the Spring backend directly at its LAN IP + port.
      window.__API_BASE_ORIGIN__ = 'http://192.168.178.114:8080';
    </script>
    <app-root></app-root>
  </body>
</html>
